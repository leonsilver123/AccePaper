# The dsh-research-app bundle patch (T30): the research-surface layer over
# dsh-web-app, which itself layers over dsh-base in the `web` profile stack.
# This layer is applied AFTER the web-app bundle, so its `webserver` row
# overrides the base/web-app transport to bind the dedicated research port
# (1120), and its `insert` rows mount the five dsh-research-* packages.
#
# Apply order within the `web` profile:
#   1. dsh-base            (core rows)
#   2. dsh-web-app         (browser surface, webserver on 3080 by default)
#   3. dsh-research-app    (THIS layer — research port 1120 + research packages)
#
# A patch replaces the targeted row's whole `config`, so the `webserver` row
# below restates every key it owns (host/port/compression*) and only changes
# the fallback port from 3080 to 1120. `inject: [webStartup]` and `name` are
# owned by the web-app row and are NOT restated here.

# ── research transport: bind the dedicated research port ─────────────────────
- id: webserver
  config:
    # Flag still wins: `--port` through the web app's webStartup provider beats
    # this fallback, so an operator can move the research server off 1120.
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 1120
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# ── research plugin roster (the five dsh-research-* packages) ────────────────
# The plugin packages are mounted as ordinary Cordis rows. The two pure
# libraries in the set (@deepseek-ai/dsh-research-core and
# @deepseek-ai/dsh-research-tools) are NOT standalone plugin rows — they expose
# no `apply`/`name` and would crash `ctx.registry.plugin`; they are bundled as
# dependencies of this package and resolved transitively by the plugin rows
# below (the same convention dsh-base uses for its pure libraries).
- insert:
    # Thin Cordis adapter exposing `ctx.research` — the 16-step research engine
    # service wrapping the hardened dsh-research-core state machine.
    - id: research-cordis
      name: '@deepseek-ai/dsh-research-cordis'
      config:
        # Making the seven-tool registration a STARTUP requirement. Without it the
        # engine takes the tolerant path and a registration failure is swallowed,
        # which is the failure mode this flag exists to remove. Verified against a
        # real 1120 boot: the profile starts with all seven tools registered.
        requireResearchTools: true
        # ── OFFLINE POSTURE (the shipped default) ──────────────────────────────
        # This bundle is the offline research product: it boots and runs a full
        # pipeline with no model credential and no network, and every artifact it
        # produces is reproducible. Deterministic prose is LABELLED as a demo draft
        # wherever it appears and must never be read as a model-written finding.
        #
        # To run against the real catalogue and a real model, replace the three
        # lines below with the block at the end of this file. That is a deployment
        # decision, not a default: `openalex` makes A1-landscape retrieve genuine
        # literature and a fabricated DOI an authoritative `not_found` (a hard
        # block), and a real prose route needs a credential for its provider route.
        literatureSearch:
          kind: fixture
        citationResolver:
          kind: fixture
        # Prose steps (A1 gap analysis, B1 method, D2 outline, D3 writing, D4
        # rebuttal) route through the REAL agent loop on a provider whose response
        # is derived from the request rather than generated. Same request, same text.
        prose:
          kind: deterministic
        # The Case Pack this deployment runs against: the seven versioned JSON files that
        # supply the research question, the central claim, the experiment configuration and
        # its scenario parameters. They are synthetic fixture content and carry that label
        # through every value derived from them. Relative paths resolve against the
        # engine's `workspace`. Point this at a different directory to run a different case.
        casePackDirectory: plan/overnight/2026-09-09/case-pack-traffic
        # Where a finished run's reproducible package is written. Every file the manifest
        # names is really written, with its byte count and content digest. This default is
        # the repository's gitignored scratch area, so a demo run leaves the tree clean;
        # point it anywhere the deployment wants the export to land. Like
        # `casePackDirectory` it is a deployment setting, not a request field.
        packageDirectory: .workbuddy/tmp/research-run-package
        # Where the durable run snapshot lives. A finished run is written here, and a later
        # process can restore it and drive it on — the run's steps, artifacts, gate verdicts,
        # abstentions and consumed approval events all survive the boundary, while no service
        # object or credential is persisted. Omitted, runs are not persisted and cannot resume.
        snapshotDirectory: .workbuddy/tmp/research-run-snapshot

    # Team / fleet orchestration service exposing `ctx.agentTeams` (red-team,
    # anchor, experiment adjudication), depending on core + tools.
    - id: research-team
      name: '@deepseek-ai/dsh-research-team'

    # Browser-side research workbench host half: inert host registration; the
    # view mounts into the conversation.view slot via the client (browser) half.
    - id: research-web
      name: '@deepseek-ai/dsh-research-web'

# ── OPT-IN: the live channels ─────────────────────────────────────────────────
# Replace the three `literatureSearch` / `citationResolver` / `prose` lines in the
# research-cordis row above with this block to run against a real model vendor and
# the real OpenAlex catalogue. It requires a credential for the prose provider route
# and network egress; without either, A1-landscape fails the step rather than
# downgrading to fixture evidence (fail-closed, no silent substitution).
#
