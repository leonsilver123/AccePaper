# The dsh-research-app bundle patch (T30): the research-surface layer over
# dsh-web-app, which itself layers over dsh-base in the `web` profile stack.
# This layer is applied AFTER the web-app bundle, so its `webserver` row
# overrides the base/web-app transport to bind the dedicated research port
# (1120), and its `insert` rows mount the five dsh-research-* packages.
#
# Apply order within the `web` profile:
#   1. dsh-base            (core rows)
#   2. dsh-web-app         (browser surface, webserver on 3080 by default)
#   3. dsh-research-app    (THIS layer — research port 1120 + research packages)
#
# A patch replaces the targeted row's whole `config`, so the `webserver` row
# below restates every key it owns (host/port/compression*) and only changes
# the fallback port from 3080 to 1120. `inject: [webStartup]` and `name` are
# owned by the web-app row and are NOT restated here.

# ── research transport: bind the dedicated research port ─────────────────────
- id: webserver
  config:
    # Flag still wins: `--port` through the web app's webStartup provider beats
    # this fallback, so an operator can move the research server off 1120.
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 1120
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# ── research plugin roster (the five dsh-research-* packages) ────────────────
# The plugin packages are mounted as ordinary Cordis rows. The two pure
# libraries in the set (@deepseek-ai/dsh-research-core and
# @deepseek-ai/dsh-research-tools) are NOT standalone plugin rows — they expose
# no `apply`/`name` and would crash `ctx.registry.plugin`; they are bundled as
# dependencies of this package and resolved transitively by the plugin rows
# below (the same convention dsh-base uses for its pure libraries).
- insert:
    # Thin Cordis adapter exposing `ctx.research` — the 16-step research engine
    # service wrapping the hardened dsh-research-core state machine.
    - id: research-cordis
      name: '@deepseek-ai/dsh-research-cordis'
      config:
        # Making the seven-tool registration a STARTUP requirement. Without it the
        # engine takes the tolerant path and a registration failure is swallowed,
        # which is the failure mode this flag exists to remove. Verified against a
        # real 1120 boot: the profile starts with all seven tools registered.
        requireResearchTools: true
        # ── WHAT THIS BUNDLE REACHES ───────────────────────────────────────────
        # Retrieval and citation resolution reach the network (OpenAlex); the prose
        # route reaches the provider configured below. What it does NOT need is a
        # credential for the prose provider to boot and run: with the deterministic
        # route, the manuscript text is produced in-process and is LABELLED as a demo
        # draft wherever it appears, and must never be read as a model-written
        # finding. A run with no network fails A1-landscape rather than downgrading to
        # fixture evidence (fail-closed, no silent substitution).
        #
        # RETRIEVAL AND CITATION RESOLUTION ARE REAL. A1-landscape searches the
        # OpenAlex catalogue and the citation identity chain resolves against it, so
        # the records in the artifacts are genuine papers and a fabricated DOI is an
        # authoritative `not_found` (a hard block) rather than a fixture verdict.
        # Measured from this repository: a bare request with no contact address
        # answers (HTTP 200, thousands of hits), so nothing here is required for it
        # to work; OpenAlex asks for a contact address only to route the caller into
        # its "polite pool", and a deployment that sets its own gets better
        # reliability. Add `mailto: <address>` to either row to do that — the value
        # is a fact about the deployment, so this file does not invent one.
        #
        # THE B CHANNEL'S ANCHOR IS NOW RETRIEVED MATERIAL, for the default study's claim. It
        # reads `runner/evidence-corpus.ts`: sources that were fetched once by hand, each with the
        # literal passage a reviewer judged and a recorded verdict on whether it supports the
        # claim. The run does NOT re-fetch them, and each source's provenance note says so. A claim
        # version the corpus does not hold falls back to the synthetic anchor in
        # `runner/anchor-fixture.ts`, whose own basis string labels it on every verdict.
        literatureSearch:
          kind: openalex
        citationResolver:
          kind: openalex
        # Prose steps (A1 gap analysis, B1 method, D2 outline, D3 writing, D4
        # rebuttal) route through the REAL agent loop on this provider route, so the
        # manuscript text is written by a model rather than by the offline stand-in.
        #
        # The key resolves per request through the credential seam (`DEEPSEEK_API_KEY`
        # by default), so a rotated key reaches the next request without a restart. With
        # no key the first prose step FAILS rather than falling back: the route is a
        # deployment decision, and a run that quietly wrote demo text would be the
        # failure this configuration exists to remove.
        #
        # The trade this makes: the deterministic route produced the same text for the
        # same request, so two runs were byte-identical. A model route does not, and a
        # snapshot replayed against it is no longer comparable.
        prose:
          kind: llm
          provider: deepseek-official
          model: deepseek-v4-pro
          # Milliseconds one write may wait for its loop to go idle. D3-writing drafts every
          # section in ONE step — one call per section, issued together — so the ceiling has to
          # cover the slowest of them under that concurrency, not a single call. At the 120 s
          # default the step died with `agent loop idle timeout after 120000ms` and the run
          # stopped there.
          idleTimeoutMs: 600000
        # The Case Pack this deployment runs against: the seven versioned JSON files that
        # supply the research question, the central claim, the experiment configuration and
        # its scenario parameters. They are synthetic fixture content and carry that label
        # through every value derived from them. Relative paths resolve against the
        # engine's `workspace`. Point this at a different directory to run a different case.
        casePackDirectory: plan/overnight/2026-09-09/case-pack-traffic-v2
        # Milliseconds one step may run. The registry declares 5 s for a tool step and 2 s for a
        # fixture step, which is a budget for the offline prose route — it answers in
        # milliseconds. This deployment routes prose to a model, where one step takes seconds, so
        # the per-step budget is raised for the whole run. Without this the first prose step is
        # recorded `timeout` and the run never leaves phase A, with no error to say why.
        stepTimeoutMs: 900000
        # Where a finished run's reproducible package is written. Every file the manifest
        # names is really written, with its byte count and content digest. This default is
        # the repository's gitignored scratch area, so a demo run leaves the tree clean;
        # point it anywhere the deployment wants the export to land. Like
        # `casePackDirectory` it is a deployment setting, not a request field.
        packageDirectory: .workbuddy/tmp/research-run-package
        # Where the durable run snapshot lives. A finished run is written here, and a later
        # process can restore it and drive it on — the run's steps, artifacts, gate verdicts,
        # abstentions and consumed approval events all survive the boundary, while no service
        # object or credential is persisted. Omitted, runs are not persisted and cannot resume.
        snapshotDirectory: .workbuddy/tmp/research-run-snapshot
        # EVALUATION, not production, and this is now a deliberate choice rather than a
        # consequence: with a retrieved anchor the production profile drives all fifteen steps and
        # stops at the human gate, so a demo run that declared it would export a package whose
        # manifest says `profileEligible: true`. The two facts are separate (`submissionReady`
        # stays false until a person approves), but a demonstration app that declares the
        # submission profile is claiming a standing for its output that its checked-in literature
        # and its offline prose stand-in do not have. Moving this to `production` belongs to the
        # release gate, not to this row.
        evidenceProfile: evaluation

    # Team / fleet orchestration service exposing `ctx.agentTeams` (red-team,
    # anchor, experiment adjudication), depending on core + tools.
    - id: research-team
      name: '@deepseek-ai/dsh-research-team'

    # Browser-side research workbench host half: inert host registration; the
    # view mounts into the conversation.view slot via the client (browser) half.
    - id: research-web
      name: '@deepseek-ai/dsh-research-web'

# ── OPT-IN: a real model vendor for the prose route ───────────────────────────
# Retrieval and citation resolution are already real (see the research-cordis row).
# What is still opt-in is the PROSE route: replace the `prose` line in that row with
# this block to write the manuscript through a real provider instead of the
# deterministic stand-in. It needs a credential for the provider route; without one
# the step fails rather than downgrading to fixture text (fail-closed, no silent
# substitution).
#
#        prose:
#          kind: llm
#          provider: deepseek-official
#          model: deepseek-v4-pro
